<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>HORUS og card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0A0A0B;color:#EDEEF0;font-family:"Space Grotesk",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;position:relative}
  .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 2px,transparent 4px);opacity:.5}
  .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.72) 100%)}
  .eye{width:340px;filter:drop-shadow(0 0 28px rgba(229,52,43,.22))}
  h1{font-size:96px;font-weight:700;letter-spacing:.05em;line-height:1}
  .tag{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#8A8F98}
  .tag .s{color:#E5342B;margin:0 13px}
  .status{position:absolute;top:42px;left:50px;font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.2em;color:#8A8F98}
  .status b{color:#E5342B;font-weight:500}
  .foot{position:absolute;bottom:42px;right:50px;font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.18em;color:#8A8F98;text-transform:uppercase}
</style></head>
<body>
  <div class="scan"></div>
  <div class="status">STATUS <b>&#9679; PRE-LAUNCH</b> &nbsp;//&nbsp; WAITLIST OPEN</div>
  <svg class="eye" viewBox="0 0 820 540" aria-hidden="true">
    <g fill="none" stroke="#E5342B" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M132 152 C290 80 530 80 690 150"/>
      <path d="M150 252 C300 168 512 170 662 214"/>
      <path d="M662 214 C548 300 322 312 150 252"/>
      <path d="M322 306 C318 376 322 432 292 476"/>
      <path d="M470 300 C582 360 700 360 712 286 C718 246 668 242 678 296"/>
    </g>
    <circle cx="400" cy="244" r="46" fill="#E5342B"/>
  </svg>
  <h1>HORUS</h1>
  <div class="tag">ALL SIDES<span class="s">/</span>THE SHAPE OF THE EVIDENCE<span class="s">/</span>NO VERDICT</div>
  <div class="foot">Intelligence terminal</div>
  <div class="vig"></div>
</body></html>

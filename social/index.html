<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HORUS - social queue</title>
<style>
  :root{
    --bg:#0A0A0C; --panel:#131318; --line:#2B2B31; --fg:#F5F2EA; --dim:#B8B0A0;
    --red:#E5342B; --green:#3FB67A; --amber:#D9A441;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:12px;padding:16px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--red)}
  header b{font-size:18px;letter-spacing:1px}
  header .meta{margin-left:auto;color:var(--dim);font-size:13px}
  main{max-width:980px;margin:0 auto;padding:20px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);
    margin-bottom:20px;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .card-head h2{font-size:16px;margin:0;font-weight:600}
  .badge{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line)}
  .badge.pending{color:var(--amber);border-color:var(--amber)}
  .badge.approved{color:var(--green);border-color:var(--green)}
  .badge.rejected{color:var(--red);border-color:var(--red)}
  .brief{padding:12px 16px;color:var(--dim);font-size:13px;line-height:1.55;
    border-bottom:1px solid var(--line);white-space:pre-wrap}
  .brief b{color:var(--fg);font-weight:600;letter-spacing:.5px}
  .body{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
  @media(max-width:760px){.body{grid-template-columns:1fr}}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tab{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;
    background:transparent;color:var(--dim);cursor:pointer}
  .tab.on{color:var(--fg);border-color:var(--fg)}
  .preview img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
  .preview .slides{display:flex;gap:8px}
  .preview .slides img{width:50%}
  .cap{white-space:pre-wrap;background:#0d0d11;border:1px solid var(--line);border-radius:8px;
    padding:12px;min-height:120px;font-size:14px}
  .cap-meta{color:var(--dim);font-size:12px;margin-top:6px}
  .cap-meta.over{color:var(--red)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
  button.act{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
  button.approve{border-color:var(--green);color:var(--green)}
  button.reject{border-color:var(--red);color:var(--red)}
  .editbox{display:none;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
  .editbox.on{display:flex}
  .editbox select,.editbox input{font:inherit;background:#0d0d11;color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:8px}
  .editbox input{flex:1;min-width:200px}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:12px 16px;max-width:90%;
    font-size:13px;display:none;z-index:20}
  .toast code{color:var(--amber);word-break:break-all}
  footer{color:var(--dim);text-align:center;padding:24px;font-size:12px}
</style>
</head>
<body>
<header>
  <span class="dot"></span><b>HORUS</b>
  <span style="color:var(--dim)">// social queue</span>
  <span class="meta" id="meta">loading ...</span>
</header>
<main id="app"><div class="empty">loading the queue ...</div></main>
<footer>No verdict. You decide. // approve sends to IG, FB, X, LinkedIn</footer>
<div class="toast" id="toast"></div>

<script>
// API base for approve/edit/reject. The standalone HORUS admin service serves
// this page same-origin and sets window.HORUS_ADMIN_API; the static GitHub Pages
// copy has neither, so its buttons fall back to a copy-paste CLI line.
const API = (new URLSearchParams(location.search)).get("api") || window.HORUS_ADMIN_API || "";
const CAP = {ig:2200, fb:63206, li:3000, x:280};
const PLATS = ["ig","fb","li","x"];

function esc(s){ const d=document.createElement("div"); d.textContent=String(s==null?"":s); return d.innerHTML; }

function toast(msg, cli){
  const t = document.getElementById("toast");
  t.textContent = msg;
  if(cli){
    const code = document.createElement("code");
    code.textContent = cli;
    t.appendChild(document.createElement("br"));
    t.appendChild(code);
  }
  t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display="none", cli?9000:3500);
}

async function act(id, kind, platform, note){
  const cli = kind==="edit"
    ? `python tools/syi/horus_social.py edit --id ${id} --platform ${platform} --note "${note||""}"`
    : `python tools/syi/horus_social.py ${kind} --id ${id}`;
  if(!API){ toast("No live API wired yet - run this, then refresh:", cli); return; }
  try{
    const r = await fetch(API.replace(/\/$/,"")+"/decide", {
      method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id, action:kind, platform, note})
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    toast(kind+" ok - refreshing ...");
    setTimeout(load, 800);
  }catch(e){ toast("API call failed ("+e.message+"). Run manually:", cli); }
}

function capMeta(text, plat){
  const n = (text||"").length, over = n > CAP[plat];
  return `<div class="cap-meta ${over?"over":""}">${n} / ${CAP[plat]} chars${over?" - OVER LIMIT":""}</div>`;
}

function card(c){
  const el = document.createElement("div"); el.className="card";
  const banners = c.banners||{};
  el.innerHTML = `
    <div class="card-head">
      <h2>${esc(c.name)}</h2>
      <span class="badge ${c.status}">${c.status}</span>
    </div>
    ${c.brief ? `<div class="brief"><b>BRIEFING</b>  ${esc(c.brief)}</div>` : ""}
    <div class="body">
      <div class="preview" data-prev>
        <div class="tabs">
          <button class="tab on" data-pv="fb">FB / LI</button>
          <button class="tab" data-pv="ig">IG carousel</button>
          <button class="tab" data-pv="x">X</button>
        </div>
        <div data-pvbox></div>
      </div>
      <div class="capwrap">
        <div class="tabs">${PLATS.map((p,i)=>`<button class="tab ${i?"":"on"}" data-cp="${p}">${p.toUpperCase()}</button>`).join("")}</div>
        <div class="cap" data-capbox></div>
        <div data-capmeta></div>
      </div>
    </div>
    <div class="actions">
      <button class="act approve" data-a="approve">Approve + post</button>
      <button class="act" data-a="toggle-edit">Request edit</button>
      <button class="act reject" data-a="reject">Reject</button>
    </div>
    <div class="editbox" data-editbox>
      <select data-editplat>${PLATS.map(p=>`<option value="${p}">${p.toUpperCase()}</option>`).join("")}</select>
      <input data-editnote placeholder="What to change (e.g. shorter hook, add the date)">
      <button class="act" data-a="send-edit">Send edit</button>
    </div>`;

  const prevBox = el.querySelector("[data-pvbox]");
  // banner srcs come from the feed - reject any absolute/scheme/protocol-relative
  // path and build via createElement so a crafted string cannot break out of the
  // src attribute (no innerHTML on feed-controlled values).
  const relSrc = (p)=>{ p = String(p==null?"":p); return /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(p) ? "" : p; };
  const imgEl = (src, alt)=>{
    const im = document.createElement("img");
    const v = relSrc(src); if(v) im.setAttribute("src", v);
    im.setAttribute("alt", alt);
    return im;
  };
  const drawPrev = (k)=>{
    prevBox.textContent = "";
    if(k==="ig"){
      const wrap = document.createElement("div"); wrap.className = "slides";
      (banners.ig||[]).forEach(s=>wrap.appendChild(imgEl(s, "IG slide")));
      prevBox.appendChild(wrap);
    } else {
      prevBox.appendChild(imgEl(banners[k]||"", k+" banner"));
    }
  };
  drawPrev("fb");
  el.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{
    el.querySelectorAll("[data-pv]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); drawPrev(b.dataset.pv);
  });

  const capBox = el.querySelector("[data-capbox]"), capMetaBox = el.querySelector("[data-capmeta]");
  const drawCap = (p)=>{ capBox.textContent = (c.captions||{})[p]||""; capMetaBox.innerHTML = capMeta((c.captions||{})[p], p); };
  drawCap("ig");
  el.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
    el.querySelectorAll("[data-cp]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); drawCap(b.dataset.cp);
  });

  const editbox = el.querySelector("[data-editbox]");
  el.querySelector('[data-a="toggle-edit"]').onclick = ()=>editbox.classList.toggle("on");
  el.querySelector('[data-a="approve"]').onclick = ()=>act(c.id,"approve");
  el.querySelector('[data-a="reject"]').onclick = ()=>act(c.id,"reject");
  el.querySelector('[data-a="send-edit"]').onclick = ()=>act(c.id,"edit",
    el.querySelector("[data-editplat]").value, el.querySelector("[data-editnote]").value);
  return el;
}

async function load(){
  const app = document.getElementById("app");
  try{
    const r = await fetch("./social_queue.json?ts="+Date.now());
    const data = await r.json();
    const cands = (data.candidates||[]).slice().reverse();
    const pending = cands.filter(c=>c.status==="pending").length;
    document.getElementById("meta").textContent =
      `${cands.length} candidate(s) // ${pending} pending // ${(data.generated_utc||"").slice(0,16).replace("T"," ")} UTC`;
    app.innerHTML = "";
    if(!cands.length){ app.innerHTML = '<div class="empty">No candidates yet. The engine queues one when a strong story breaks.</div>'; return; }
    cands.forEach(c=>app.appendChild(card(c)));
  }catch(e){
    app.innerHTML = '<div class="empty">Could not load social_queue.json ('+e.message+'). Run: python tools/syi/horus_social.py export</div>';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
